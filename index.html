<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DrawStep</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Screen Wrapper taking full viewport dimensions */
        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* Fullscreen Canvas Image stretching edge-to-edge with smooth fade transition */
        .game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }

        .game-canvas.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Interactive Hitbox Overlay Layer */
        .landing-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
            z-index: 5;
        }

        .landing-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Hotspot over 'Get Started' */
        .btn-get-started {
            position: absolute;
            bottom: 18.5%;
            left: 17%;
            width: 66%;
            height: 5.5%;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
            /* Uncomment background below for debug testing of hotspot placement */
            /* background: rgba(255, 0, 0, 0.3); */
        }

        /* Hotspot over 'View plans' */
        .btn-view-plans {
            position: absolute;
            bottom: 11%;
            left: 35%;
            width: 30%;
            height: 3.5%;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
            /* Uncomment background below for debug testing of hotspot placement */
            /* background: rgba(0, 255, 0, 0.3); */
        }
    </style>
</head>
<body>

    <div class="screen-container" id="appContainer">
        <!-- Full Screen Background Graphic Asset -->
        <img src="assets/landing.png" alt="DrawStep Landing Screen" class="game-canvas active" id="screenLandingBg">

        <!-- Clickable Overlay Hotspots Layer -->
        <div class="landing-ui-layer active" id="landingUi">
            <a href="#get-started" class="btn-get-started" aria-label="Get Started" onclick="handleAction('get-started')"></a>
            <a href="#view-plans" class="btn-view-plans" aria-label="View Plans" onclick="handleAction('view-plans')"></a>
        </div>
    </div>

    <script>
        // Force portrait orientation lock across mobile screen browsers
        function lockPortraitOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }

        window.addEventListener('load', () => {
            lockPortraitOrientation();
        });

        window.addEventListener('orientationchange', () => {
            lockPortraitOrientation();
        });

        function handleAction(actionType) {
            console.log("Action triggered:", actionType);
        }
    </script>
</body>
</html>
