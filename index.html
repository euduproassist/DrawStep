<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrawStep - Draw it step by step</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-purple: #7c7cf8;
            --primary-hover: #6a6ahf;
            --text-dark: #1e2538;
            --text-muted: #67748e;
            --bg-gradient: radial-gradient(circle at 50% 30%, #ffffff 0%, #f4f6fa 100%);
            --btn-shadow: 0 10px 25px rgba(124, 124, 248, 0.3);
            --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--bg-gradient);
            color: var(--text-dark);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
        }

        /* Top Logo Header */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--text-dark);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: -0.5px;
        }

        .logo-title span {
            color: var(--primary-purple);
        }

        .pencil-icon-wrapper {
            position: relative;
            display: inline-block;
            margin-left: 2px;
        }

        .pencil-icon-wrapper i {
            color: var(--primary-purple);
            font-size: 2.2rem;
            transform: rotate(-10deg);
        }

        .tagline {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
        }

        /* Hero Visual Section */
        .hero-container {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            margin: 20px 0 40px;
            position: relative;
        }

        .hero-left h1 {
            font-size: 2.7rem;
            font-weight: 800;
            line-height: 1.18;
            color: var(--text-dark);
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .hero-left h1 span {
            color: var(--primary-purple);
            display: block;
        }

        .hero-left p {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 380px;
            font-weight: 500;
        }

        /* Illustration Visual Stack */
        .hero-right-visual {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 380px;
        }

        /* Large Drawing Card */
        .sketch-card {
            width: 310px;
            height: 380px;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: var(--card-shadow);
            transform: rotate(6deg);
            padding: 16px;
            position: relative;
            z-index: 2;
            border: 1px solid #eaeaea;
        }

        .sketch-card-inner {
            width: 100%;
            height: 100%;
            border: 1px dashed #d1d5db;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        /* Tape Element */
        .tape-top {
            position: absolute;
            top: -12px;
            right: 40px;
            width: 70px;
            height: 24px;
            background: rgba(210, 215, 255, 0.6);
            transform: rotate(-15deg);
            z-index: 5;
            backdrop-filter: blur(2px);
        }

        .tape-photo {
            position: absolute;
            top: -10px;
            left: 20px;
            width: 50px;
            height: 18px;
            background: rgba(180, 210, 255, 0.6);
            transform: rotate(5deg);
            z-index: 5;
        }

        /* Small Photo Card */
        .photo-card {
            position: absolute;
            left: -10px;
            bottom: 20px;
            width: 140px;
            height: 150px;
            background: #ffffff;
            padding: 8px 8px 16px 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            transform: rotate(-8deg);
            z-index: 3;
            border-radius: 2px;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Arrow Line */
        .arrow-svg {
            position: absolute;
            left: 100px;
            bottom: 120px;
            width: 80px;
            height: 60px;
            z-index: 4;
            pointer-events: none;
        }

        /* Pencils */
        .pencil-black {
            position: absolute;
            right: -20px;
            bottom: 10px;
            width: 180px;
            height: 12px;
            background: #222225;
            transform: rotate(-40deg);
            z-index: 4;
            border-radius: 2px 6px 6px 2px;
            box-shadow: -5px 5px 10px rgba(0,0,0,0.15);
        }

        .pencil-wood {
            position: absolute;
            right: -40px;
            bottom: -10px;
            width: 200px;
            height: 12px;
            background: #d4a373;
            transform: rotate(-35deg);
            z-index: 3;
            border-radius: 2px 6px 6px 2px;
            box-shadow: -5px 5px 10px rgba(0,0,0,0.1);
        }

        /* Eraser */
        .eraser {
            position: absolute;
            top: 20px;
            right: -10px;
            width: 45px;
            height: 25px;
            background: #e5e5e5;
            border-radius: 4px;
            transform: rotate(20deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            z-index: 3;
        }

        /* Bottom Action Buttons */
        .action-area {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        .btn-primary {
            width: 100%;
            height: 54px;
            background: var(--primary-purple);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--btn-shadow);
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            width: 100%;
            height: 54px;
            background: #ffffff;
            color: var(--text-dark);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        .view-plans-link {
            color: var(--primary-purple);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.98rem;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .view-plans-link:hover {
            text-decoration: underline;
        }

        /* Responsive Styles (Prevents Horizontal Scroll) */
        @media (max-width: 820px) {
            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 30px;
            }

            .hero-left h1 {
                font-size: 2.2rem;
            }

            .hero-left p {
                margin: 0 auto;
            }

            .hero-right-visual {
                scale: 0.9;
            }
        }

        @media (max-width: 480px) {
            .main-wrapper {
                padding: 24px 16px;
            }

            .logo-title {
                font-size: 2.2rem;
            }

            .hero-left h1 {
                font-size: 1.8rem;
            }

            .hero-right-visual {
                scale: 0.75;
                margin: -20px 0;
            }

            .btn-primary, .btn-secondary {
                height: 50px;
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- Header / Logo -->
        <header class="brand-header">
            <div class="logo-title">
                Draw<span>Step</span>
                <div class="pencil-icon-wrapper">
                    <i class="fas fa-pencil-alt"></i>
                </div>
            </div>
            <p class="tagline">Draw it step by step.</p>
        </header>

        <!-- Main Hero Section -->
        <main class="hero-container">
            
            <div class="hero-left">
                <h1>Turn any photo <span>into a step-by-step</span> <span>drawing lesson.</span></h1>
                <p>Choose a photo, pick your style, and let DrawStep guide you from the first line to the finished artwork.</p>
            </div>

            <div class="hero-right-visual">
                
                <!-- Tape Top -->
                <div class="tape-top"></div>
                <div class="eraser"></div>

                <!-- Main Pencil Sketch Paper -->
                <div class="sketch-card">
                    <div class="sketch-card-inner">
                        <!-- Landscape Pencil Drawing -->
                        <svg viewBox="0 0 300 380" width="100%" height="100%" style="background: #fafafa;">
                            <path d="M 10 280 Q 80 260, 150 270 T 290 280" stroke="#777" stroke-width="1.5" fill="none"/>
                            <polygon points="120,80 180,200 60,220" stroke="#555" stroke-width="1.5" fill="none"/>
                            <polygon points="180,100 240,210 140,220" stroke="#666" stroke-width="1.5" fill="none"/>
                            <path d="M 0 300 Q 150 250, 300 310" stroke="#444" stroke-width="2" fill="none"/>
                        </svg>
                    </div>
                </div>

                <!-- Small Real Photo Card -->
                <div class="photo-card">
                    <div class="tape-photo"></div>
                    <svg viewBox="0 0 100 100" width="100%" height="100%">
                        <rect width="100" height="100" fill="#3b82f6"/>
                        <polygon points="20,80 50,30 80,80" fill="#15803d"/>
                        <polygon points="50,80 70,40 90,80" fill="#166534"/>
                        <circle cx="80" cy="25" r="8" fill="#fef08a"/>
                    </svg>
                </div>

                <!-- Curved Connecting Arrow -->
                <svg class="arrow-svg" viewBox="0 0 80 60" fill="none">
                    <path d="M 10 50 Q 40 10, 70 30" stroke="#7c7cf8" stroke-width="2.5" fill="none" stroke-dasharray="4 2"/>
                    <polyline points="62,25 70,30 68,38" stroke="#7c7cf8" stroke-width="2.5" fill="none"/>
                </svg>

                <!-- Pencils -->
                <div class="pencil-black"></div>
                <div class="pencil-wood"></div>

            </div>

        </main>

        <!-- Bottom Actions -->
        <footer class="action-area">
            <a href="#" class="btn-primary">Get Started</a>
            <a href="#" class="btn-secondary">
                <i class="far fa-user"></i> Sign In
            </a>
            <a href="#" class="view-plans-link">
                View plans <i class="fas fa-chevron-right" style="font-size: 0.8rem;"></i>
            </a>
        </footer>

    </div>

</body>
</html>
