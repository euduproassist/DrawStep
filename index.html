<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrawStep</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #f7f9fd;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Container that fits the full screen height while maintaining the image aspect ratio */
        .landing-container {
            position: relative;
            width: 100%;
            max-width: 500px; /* Standard mobile app width preview */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Full Screen Background Graphic */
        .landing-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Invisible clickable hotspot over 'Get Started' */
        .btn-get-started {
            position: absolute;
            bottom: 18.5%;
            left: 17%;
            width: 66%;
            height: 5.5%;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
            /* Debug mode: uncomment background line below to test hotspot alignment */
            /* background: rgba(255, 0, 0, 0.3); */
        }

        /* Invisible clickable hotspot over 'View plans' */
        .btn-view-plans {
            position: absolute;
            bottom: 11%;
            left: 35%;
            width: 30%;
            height: 3.5%;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
            /* Debug mode: uncomment background line below to test hotspot alignment */
            /* background: rgba(0, 255, 0, 0.3); */
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <!-- Main Graphic Asset -->
        <img src="assets/landing.png" alt="DrawStep Landing Screen" class="landing-bg">

        <!-- Clickable Overlay Hotspots -->
        <a href="#get-started" class="btn-get-started" aria-label="Get Started"></a>
        <a href="#view-plans" class="btn-view-plans" aria-label="View Plans"></a>
    </div>

</body>
</html>
