<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrawStep</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents any scrolling */
            background-color: #f7f9fd;
            -webkit-tap-highlight-color: transparent;
        }

        /* Container forced to take up 100% of the viewport width and height */
        .landing-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Forces the image to stretch to the exact screen dimensions without cropping */
        .landing-bg {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Stretches to fit 100% of available space without clipping */
            display: block;
        }

        /* Hotspot over 'Get Started' */
        .btn-get-started {
            position: absolute;
            bottom: 18.5%;
            left: 17%;
            width: 66%;
            height: 5.5%;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
        }

        /* Hotspot over 'View plans' */
        .btn-view-plans {
            position: absolute;
            bottom: 11%;
            left: 35%;
            width: 30%;
            height: 3.5%;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <!-- Main Graphic Asset -->
        <img src="assets/landing.png" alt="DrawStep Landing Screen" class="landing-bg">

        <!-- Clickable Overlay Hotspots -->
        <a href="#get-started" class="btn-get-started" aria-label="Get Started"></a>
        <a href="#view-plans" class="btn-view-plans" aria-label="View Plans"></a>
    </div>

</body>
</html>
