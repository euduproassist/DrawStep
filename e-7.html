<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrawStep - Turn Any Photo Into A Lesson</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Modern Reset to guarantee ZERO sideways/horizontal scrolling */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden; /* Prevents horizontal scrolling on any screen width */
            background-color: #f3f3f9;
            /* Subliminal watercolor wash gradient background matching image */
            background-image: 
                radial-gradient(at 15% 15%, rgba(220, 215, 255, 0.5) 0px, transparent 55%),
                radial-gradient(at 85% 20%, rgba(225, 220, 255, 0.45) 0px, transparent 50%),
                radial-gradient(at 50% 80%, rgba(230, 225, 255, 0.6) 0px, transparent 60%);
            background-attachment: fixed;
            color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            padding: 28px 22px 36px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Top Navigation Header */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .top-icon {
            width: 28px;
            height: 28px;
            stroke: #635bff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            cursor: pointer;
        }

        /* Brand & Logo Section */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 6px;
            position: relative;
        }

        .logo-title {
            font-size: 2.7rem;
            font-weight: 800;
            color: #14142b;
            letter-spacing: -0.8px;
            line-height: 1;
        }

        .logo-title span {
            color: #5542e2;
        }

        /* Stylized Pencil in Logo with S-Trail */
        .logo-pencil-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-left: 2px;
        }

        .logo-pencil-svg {
            width: 32px;
            height: 32px;
            transform: rotate(-15deg);
        }

        .brand-subtitle {
            font-size: 1.05rem;
            color: #585878;
            font-weight: 500;
        }

        /* Main Headline */
        .main-heading {
            text-align: center;
            font-size: 1.7rem;
            font-weight: 800;
            color: #14142b;
            line-height: 1.32;
            margin-bottom: 32px;
        }

        .main-heading span {
            color: #5542e2;
        }

        /* 4-Step Grid */
        .steps-grid {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 36px;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            flex: 1;
            position: relative;
        }

        .step-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 4px;
            width: 1px;
            height: 40px;
            background-color: #e2e2f0;
        }

        .step-icon {
            width: 28px;
            height: 28px;
            stroke: #5542e2;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .step-text {
            font-size: 0.76rem;
            font-weight: 600;
            color: #33334d;
            max-width: 80px;
            line-height: 1.2;
        }

        /* Photo Showcase Section */
        .showcase-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 38px;
            padding: 0 4px;
        }

        .photo-card {
            background: #ffffff;
            padding: 10px 10px 28px 10px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.09);
            border-radius: 2px;
            position: relative;
        }

        /* Left Original Photo */
        .photo-card.photo-left {
            width: 48%;
            transform: rotate(-5deg);
            z-index: 1;
        }

        /* Right Sketch Photo */
        .photo-card.sketch-right {
            width: 52%;
            transform: rotate(3deg);
            margin-left: -8px;
            z-index: 2;
            padding-bottom: 36px;
        }

        .photo-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            border-radius: 1px;
        }

        /* Lavender Washi Tape Header */
        .tape {
            position: absolute;
            top: -12px;
            left: 20%;
            width: 65px;
            height: 22px;
            background: rgba(195, 175, 255, 0.7);
            transform: rotate(-2deg);
            z-index: 3;
            backdrop-filter: blur(1px);
        }

        /* Curved Connecting Arrow */
        .arrow-curve {
            position: absolute;
            top: 25%;
            left: 44%;
            width: 40px;
            height: 26px;
            z-index: 4;
        }

        .arrow-curve svg {
            width: 100%;
            height: 100%;
            stroke: #5542e2;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Overlay Pencil */
        .pencil-overlay {
            position: absolute;
            bottom: -50px;
            right: -20px;
            width: 150px;
            height: 220px;
            z-index: 10;
            pointer-events: none;
        }

        /* Call To Action Buttons */
        .action-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            z-index: 5;
        }

        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, #6b5ce7 0%, #4c3ae3 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 18px 24px;
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(76, 58, 227, 0.35);
            text-decoration: none;
        }

        .primary-btn span {
            flex: 1;
            text-align: center;
        }

        .primary-btn svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            position: absolute;
            right: 22px;
        }

        .secondary-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            color: #5542e2;
        }

        .secondary-link svg {
            width: 18px;
            height: 18px;
            stroke: #5542e2;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Bottom Decorative Line with Heart */
        .bottom-decoration {
            width: 100%;
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .bottom-decoration svg {
            width: 100%;
            max-width: 340px;
            height: 28px;
            stroke: #7b6be6;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <main class="app-container">
        
        <!-- Top Bar Navigation Icons -->
        <header class="top-bar">
            <!-- Crown Icon -->
            <svg class="top-icon" viewBox="0 0 24 24">
                <path d="M3 17L5 8L10 12L12 5L14 12L19 8L21 17H3Z"></path>
                <circle cx="12" cy="19" r="1" fill="#635bff"></circle>
            </svg>
            <!-- Gear / Settings Icon -->
            <svg class="top-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </header>

        <!-- Brand Section -->
        <section class="brand-section">
            <div class="logo-row">
                <h1 class="logo-title">Draw<span>Step</span></h1>
                <div class="logo-pencil-wrapper">
                    <svg class="logo-pencil-svg" viewBox="0 0 40 40" fill="none">
                        <path d="M10 25L25 10L30 15L15 30L8 32L10 25Z" stroke="#5542e2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 13L27 18" stroke="#5542e2" stroke-width="2.5"/>
                        <path d="M8 32C4 35 2 38 6 38C10 38 12 34 16 34" stroke="#5542e2" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
            <p class="brand-subtitle">Draw it step by step.</p>
        </section>

        <!-- Main Title Header -->
        <h2 class="main-heading">
            Turn any photo into a<br>step-by-step <span>drawing lesson.</span>
        </h2>

        <!-- Process Steps Grid -->
        <div class="steps-grid">
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="3"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <path d="M21 15l-5-5L5 21"></path>
                </svg>
                <span class="step-text">Choose a photo</span>
            </div>
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                </svg>
                <span class="step-text">Pick your style</span>
            </div>
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"></path>
                    <path d="M19 15l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1z"></path>
                </svg>
                <span class="step-text">Get your lesson</span>
            </div>
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <rect x="4" y="3" width="16" height="11" rx="1"></rect>
                    <path d="M12 14v7M8 21l2-7M16 21l-2-7M2 10h20"></path>
                </svg>
                <span class="step-text">Draw step by step</span>
            </div>
        </div>

        <!-- Visual Photo Showcase -->
        <div class="showcase-container">
            <!-- Original Photo Card -->
            <div class="photo-card photo-left">
                <div class="tape"></div>
                <img src="https://picsum.photos/id/1015/400/400" alt="Original Mountain Landscape">
            </div>

            <!-- Curved Arrow -->
            <div class="arrow-curve">
                <svg viewBox="0 0 30 20">
                    <path d="M2 15 C 10 2, 20 2, 28 10 M 22 5 L 28 10 L 23 16"></path>
                </svg>
            </div>

            <!-- Pencil Sketch Card -->
            <div class="photo-card sketch-right">
                <img src="https://picsum.photos/id/1015/400/400?grayscale" alt="Pencil Sketch Mountain Landscape">
            </div>

            <!-- Overlapping Drawing Pencil SVG -->
            <svg class="pencil-overlay" viewBox="0 0 100 200" fill="none">
                <g transform="rotate(-35, 50, 100)">
                    <rect x="42" y="10" width="16" height="140" fill="#1e1e24" rx="2"/>
                    <path d="M42 150 L50 175 L58 150 Z" fill="#d3a373"/>
                    <path d="M48 168 L50 175 L52 168 Z" fill="#1e1e24"/>
                    <rect x="42" y="10" width="16" height="12" fill="#c49a6c" rx="1"/>
                </g>
            </svg>
        </div>

        <!-- Action Buttons Section -->
        <div class="action-container">
            <a href="#" class="primary-btn">
                <span>Get Started</span>
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>

            <a href="#" class="secondary-link">
                <span>View plans</span>
                <svg viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>
        </div>

        <!-- Bottom Wave & Heart Decoration -->
        <div class="bottom-decoration">
            <svg viewBox="0 0 300 24">
                <path d="M0 12 C 50 12, 70 2, 100 12 C 130 22, 140 2, 148 10 C 151 6, 155 6, 158 10 C 166 2, 176 22, 196 12 C 226 2, 250 12, 300 12"/>
            </svg>
        </div>

    </main>

</body>
</html>
