<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrawStep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Modern Reset to guarantee zero horizontal scrolling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden; /* Prevents horizontal scrolling on all devices */
            background: #f8f9fe;
            background-image: 
                radial-gradient(at 10% 10%, rgba(220, 225, 255, 0.4) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(230, 220, 255, 0.4) 0px, transparent 50%);
            color: #2D3142;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            padding: 24px 20px 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar svg {
            width: 26px;
            height: 26px;
            stroke: #6C5CE7;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            cursor: pointer;
        }

        /* Brand / Logo Section */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .logo-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1E2029;
            letter-spacing: -0.5px;
        }

        .logo-title span {
            color: #6C5CE7;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            stroke: #6C5CE7;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-subtitle {
            font-size: 1.05rem;
            color: #5A607F;
            font-weight: 500;
        }

        /* Main Heading */
        .main-heading {
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            color: #1E2029;
            line-height: 1.3;
            margin-bottom: 28px;
        }

        .main-heading span {
            color: #6C5CE7;
        }

        /* 4-Step Process Grid */
        .steps-grid {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            flex: 1;
            position: relative;
        }

        .step-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 10px;
            width: 1px;
            height: 36px;
            background-color: #E2E8F0;
        }

        .step-icon {
            width: 26px;
            height: 26px;
            stroke: #6C5CE7;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .step-text {
            font-size: 0.78rem;
            font-weight: 600;
            color: #4A5568;
            max-width: 80px;
            line-height: 1.25;
        }

        /* Visual Showcase (Original Photo -> Sketch Photo) */
        .showcase-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            margin-bottom: 36px;
            padding: 10px 0;
        }

        .photo-card {
            width: 48%;
            background: #ffffff;
            padding: 8px 8px 12px 8px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            position: relative;
        }

        /* Left photo: Pivot at bottom-right, tilted out to create wide top gap */
        .photo-card.photo-left {
            transform-origin: bottom right;
            transform: rotate(-8deg);
            margin-right: -12px; /* Pulls bottom corners together to touch */
            z-index: 1;
        }

        /* Right photo: Pivot at bottom-left, slight tilt right */
        .photo-card.sketch-right {
            transform-origin: bottom left;
            transform: rotate(5deg);
            z-index: 2;
        }

        .photo-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        /* Purple Washi Tape */
        .tape {
            position: absolute;
            top: -12px;
            left: 20%;
            width: 60px;
            height: 20px;
            background: rgba(168, 148, 255, 0.55);
            transform: rotate(-3deg);
            z-index: 3;
            backdrop-filter: blur(2px);
        }

        /* Curved Purple Arrow centered inside the top open gap */
        .arrow-curve {
            position: absolute;
            top: 28%;
            left: 45%;
            width: 38px;
            height: 26px;
            z-index: 4;
            transform: translateX(-50%);
        }

        .arrow-curve svg {
            width: 100%;
            height: 100%;
            stroke: #6C5CE7;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Overlapping Realistic Pencil */
        .pencil-overlay {
            position: absolute;
            bottom: -35px;
            right: -25px;
            width: 140px;
            transform: rotate(-42deg);
            z-index: 10;
            filter: drop-shadow(4px 8px 8px rgba(0,0,0,0.15));
            pointer-events: none;
        }

        /* Buttons Container */
        .action-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, #7C69EF 0%, #5842E3 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 18px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(88, 66, 227, 0.3);
            text-decoration: none;
        }

        .primary-btn span {
            flex: 1;
            text-align: center;
        }

        .primary-btn svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            position: absolute;
            right: 20px;
        }

        .secondary-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            color: #6C5CE7;
        }

        .secondary-link svg {
            width: 18px;
            height: 18px;
            stroke: #6C5CE7;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Bottom Wave & Heart Line */
        .bottom-decoration {
            width: 100%;
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .bottom-decoration svg {
            width: 100%;
            max-width: 320px;
            height: 24px;
            stroke: #8C7CFF;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <main class="app-container">
        
        <!-- Header Controls -->
        <header class="top-bar">
            <svg viewBox="0 0 24 24">
                <path d="M3 17L5 8L10 12L12 5L14 12L19 8L21 17H3Z"></path>
                <line x1="3" y1="20" x2="21" y2="20"></line>
            </svg>
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </header>

        <!-- Brand Section -->
        <section class="brand-section">
            <div class="logo-row">
                <h1 class="logo-title">Draw<span>Step</span></h1>
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    <path d="M2 2l7.586 7.586"></path>
                </svg>
            </div>
            <p class="brand-subtitle">Draw it step by step.</p>
        </section>

        <!-- Main Title -->
        <h2 class="main-heading">
            Turn any photo into a<br>step-by-step <span>drawing lesson.</span>
        </h2>

        <!-- Process Steps Row -->
        <div class="steps-grid">
            <!-- Step 1 -->
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span class="step-text">Choose a photo</span>
            </div>
            <!-- Step 2 -->
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                </svg>
                <span class="step-text">Pick your style</span>
            </div>
            <!-- Step 3: Sparkles -->
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <path d="M12 3l1.9 4.8L18 9.7l-4.1 3.5L15 18l-5-3.1L5 18l1.1-4.8L2 9.7l4.1-1.9z"></path>
                </svg>
                <span class="step-text">Get your lesson</span>
            </div>
            <!-- Step 4: Easel -->
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <rect x="4" y="4" width="16" height="10" rx="1"></rect>
                    <path d="M12 14v7M8 21l2-7M16 21l-2-7M2 10h20"></path>
                </svg>
                <span class="step-text">Draw step by step</span>
            </div>
        </div>

        <!-- Visual Showcase -->
        <div class="showcase-container">
            <!-- Left Photo (Original) -->
            <div class="photo-card photo-left">
                <div class="tape"></div>
                <img src="https://picsum.photos/id/1015/300/300" alt="Landscape Photo">
            </div>

            <!-- Curved Arrow -->
            <div class="arrow-curve">
                <svg viewBox="0 0 24 24">
                    <path d="M3 14C6 8 14 6 21 10M21 10L16 7M21 10L18 14"></path>
                </svg>
            </div>

            <!-- Right Photo (Sketch) -->
            <div class="photo-card sketch-right">
                <img src="https://picsum.photos/id/1015/300/300?grayscale" alt="Landscape Sketch">
            </div>

            <!-- Drawing Pencil Overlay -->
            <svg class="pencil-overlay" viewBox="0 0 200 30" fill="none">
                <path d="M10 15L170 5L185 15L170 25L10 15Z" fill="#1E2029"/>
                <path d="M170 5L185 15L170 25Z" fill="#D1D5DB"/>
                <path d="M185 15L200 15L185 15Z" stroke="#000" stroke-width="3"/>
            </svg>
        </div>

        <!-- Action Callouts -->
        <div class="action-container">
            <a href="#" class="primary-btn">
                <span>Get Started</span>
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>

            <a href="#" class="secondary-link">
                <span>View plans</span>
                <svg viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>
        </div>

        <!-- Bottom Heart Decor Line -->
        <div class="bottom-decoration">
            <svg viewBox="0 0 300 24">
                <path d="M0 12 C 50 12, 70 2, 100 12 C 130 22, 140 2, 150 10 C 153 5, 157 5, 160 10 C 170 2, 180 22, 200 12 C 230 2, 250 12, 300 12"/>
            </svg>
        </div>

    </main>

</body>
</html>
