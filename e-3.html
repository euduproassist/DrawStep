<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrawStep - Turn any photo into a drawing lesson</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset for zero sideways scrolling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #f3f0fb;
            color: #000000;
            display: flex;
            justify-content: center;
        }

        /* Container that fills the screen dynamically with zero horizontal gap */
        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 24px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Top Navigation Header */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .icon-btn svg {
            width: 28px;
            height: 28px;
            stroke: #442cf5;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Logo Section */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            text-align: center;
        }

        .logo-title {
            font-size: 2.3rem;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo-title span {
            color: #442cf5;
        }

        .logo-title svg {
            width: 32px;
            height: 32px;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: rotate(-10deg);
        }

        .logo-subtitle {
            font-size: 1rem;
            color: #000000;
            font-weight: 400;
            margin-top: 4px;
        }

        /* Hero Heading Text */
        .hero-heading {
            font-size: 1.65rem;
            font-weight: 800;
            text-align: center;
            line-height: 1.35;
            color: #000000;
            margin-bottom: 28px;
            padding: 0 10px;
        }

        .hero-heading .highlight {
            color: #442cf5;
        }

        /* 4-Steps Feature Grid */
        .steps-grid {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            position: relative;
        }

        .steps-grid .step-item:not(:last-child):after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background-color: #dcd3fc;
        }

        .step-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 0 2px;
        }

        .step-icon-box {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .step-icon-box svg {
            width: 26px;
            height: 26px;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .step-label {
            font-size: 0.72rem;
            font-weight: 600;
            color: #000000;
            line-height: 1.2;
        }

        /* Showcase Preview Frame (Photos & Arrow) */
        .showcase-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 36px;
            gap: 12px;
        }

        .photo-card {
            width: 46%;
            background: #ffffff;
            padding: 8px 8px 24px 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            position: relative;
        }

        .photo-card.left-card {
            transform: rotate(-4deg);
        }

        .photo-card.right-card {
            transform: rotate(4deg);
            background: #fdfcf7;
            padding-bottom: 12px;
        }

        .photo-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        /* Washi Tape Graphic on Photo */
        .washi-tape {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(2deg);
            width: 60px;
            height: 18px;
            background-color: rgba(200, 182, 248, 0.65);
            z-index: 2;
        }

        /* Curved Arrow between cards */
        .arrow-connector {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            width: 44px;
            height: 24px;
        }

        .arrow-connector svg {
            width: 100%;
            height: 100%;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Realistic Pencil Graphic */
        .pencil-img {
            position: absolute;
            bottom: -18px;
            right: -12px;
            width: 65px;
            transform: rotate(-35deg);
            z-index: 4;
            filter: drop-shadow(-3px 5px 8px rgba(0,0,0,0.25));
        }

        /* Get Started Action Button */
        .cta-button {
            width: 100%;
            background: linear-gradient(135deg, #6c5ce7 0%, #442cf5 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 18px 24px;
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(68, 44, 245, 0.3);
            text-decoration: none;
            margin-bottom: 24px;
            transition: transform 0.1s ease;
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        .cta-button svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Footer Link & Bottom Vector Graphic */
        .footer-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 1rem;
            font-weight: 700;
            color: #442cf5;
            text-decoration: none;
            margin-bottom: 28px;
        }

        .footer-link svg {
            width: 18px;
            height: 18px;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bottom-decoration {
            width: 90%;
            display: flex;
            justify-content: center;
        }

        .bottom-decoration svg {
            width: 100%;
            height: 32px;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <main class="app-container">
        
        <!-- Top Navigation -->
        <header class="top-nav">
            <button class="icon-btn" aria-label="Crown feature">
                <svg viewBox="0 0 24 24">
                    <path d="M2 18L5 8L9.5 13L14.5 6L19 13L22 8L20 18H2Z"></path>
                    <line x1="2" y1="21" x2="22" y2="21"></line>
                </svg>
            </button>
            <button class="icon-btn" aria-label="Settings">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <!-- Brand Logo Header -->
        <div class="logo-section">
            <h1 class="logo-title">
                Draw<span>Step</span>
                <svg viewBox="0 0 24 24">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    <path d="M2 2l7.586 7.586"></path>
                </svg>
            </h1>
            <p class="logo-subtitle">Draw it step by step.</p>
        </div>

        <!-- Main Banner Title -->
        <h2 class="hero-heading">
            Turn any photo into a<br>step-by-step <span class="highlight">drawing lesson.</span>
        </h2>

        <!-- 4 Steps Interactive Bar -->
        <div class="steps-grid">
            <div class="step-item">
                <div class="step-icon-box">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </div>
                <span class="step-label">Choose a photo</span>
            </div>
            <div class="step-item">
                <div class="step-icon-box">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                        <path d="M2 2l7.586 7.586"></path>
                    </svg>
                </div>
                <span class="step-label">Pick your style</span>
            </div>
            <div class="step-item">
                <div class="step-icon-box">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                    </svg>
                </div>
                <span class="step-label">Get your lesson</span>
            </div>
            <div class="step-item">
                <div class="step-icon-box">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2v4m0 12v4M2 12h4m12 0h4"></path>
                        <rect x="4" y="6" width="16" height="12" rx="2"></rect>
                    </svg>
                </div>
                <span class="step-label">Draw step by step</span>
            </div>
        </div>

        <!-- Visual Photo to Sketch Showcase Preview -->
        <div class="showcase-container">
            <!-- Left Color Photo Card -->
            <div class="photo-card left-card">
                <div class="washi-tape"></div>
                <img src="assets/origin-land.png" alt="Original landscape photo">
            </div>

            <!-- Curved Connecting Arrow -->
            <div class="arrow-connector">
                <svg viewBox="0 0 24 24">
                    <path d="M3 12C3 7 8 4 15 6C18.5 7.1 21 10 21 10M21 10L16 6M21 10L17 14"></path>
                </svg>
            </div>

            <!-- Right Pencil Sketch Card with Pencil Asset -->
            <div class="photo-card right-card">
                <img src="assets/pencil-land.png" alt="Pencil drawn landscape sketch">
                
                <!-- Realistic Vector Pencil Overlapping Bottom Right -->
                <svg class="pencil-img" viewBox="0 0 100 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M35 10L65 10L70 190L30 190L35 10Z" fill="#e5c158" stroke="#b39029" stroke-width="3"/>
                    <path d="M30 190L50 230L70 190L30 190Z" fill="#222222"/>
                    <path d="M45 210L50 230L55 210L45 210Z" fill="#d0d0d0"/>
                    <rect x="30" y="10" width="40" height="25" fill="#f07070" stroke="#c04040" stroke-width="2"/>
                    <rect x="30" y="35" width="40" height="8" fill="#d0d0d0"/>
                    <path d="M42 10L42 190M58 10L58 190" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
                </svg>
            </div>
        </div>

        <!-- Get Started Button -->
        <a href="#" class="cta-button">
            Get Started
            <svg viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>

        <!-- View Plans Footer Link -->
        <a href="#" class="footer-link">
            View plans
            <svg viewBox="0 0 24 24">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </a>

        <!-- Bottom Wave / Heart Graphic -->
        <div class="bottom-decoration">
            <svg viewBox="0 0 200 32" preserveAspectRatio="none">
                <path d="M0,16 C40,32 70,0 100,16 C130,32 160,0 200,16"></path>
                <path d="M95,14 C92,10 87,10 84,13 C81,16 81,20 85,24 L95,30 L105,24 C109,20 109,16 106,13 C103,10 98,10 95,14 Z" fill="none" stroke-width="2"/>
            </svg>
        </div>

    </main>

</body>
</html>
