<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrawStep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset for zero sideways scrolling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            overflow-x: hidden; /* Strictly prevents sideways scrolling */
            background-color: #ffffff; /* Strict pure white as requested */
            color: #000000; /* Strict black text, no grey */
            display: flex;
            justify-content: center;
        }

        /* Container that fills the screen dynamically */
        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 24px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Top Bar Layout */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            stroke: #442cf5;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Brand / Logo Section */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .logo-title {
            font-size: 2.3rem;
            font-weight: 800;
            color: #000000;
            letter-spacing: -0.5px;
        }

        .logo-title span {
            color: #442cf5;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: rotate(15deg);
        }

        .brand-subtitle {
            font-size: 1rem;
            color: #000000;
            font-weight: 400;
        }

        /* Heading Section */
        .main-heading {
            text-align: center;
            font-size: 1.55rem;
            font-weight: 800;
            color: #000000;
            line-height: 1.35;
            margin-bottom: 32px;
            padding: 0 10px;
        }

        .main-heading span {
            color: #442cf5;
        }

        /* Steps / Features Row */
        .steps-grid {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            padding: 0 4px;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            flex: 1;
            position: relative;
        }

        .step-item:not(:last-child):after {
            content: '';
            position: absolute;
            right: 0;
            top: 22px;
            width: 1px;
            height: 24px;
            background-color: #e5e5e5;
        }

        .step-icon {
            width: 24px;
            height: 24px;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .step-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: #000000;
            max-width: 75px;
            line-height: 1.2;
        }

        /* Visual Showcase Section (Photos & Arrow) */
        .showcase-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 36px;
            gap: 12px;
        }

        .photo-card {
            width: 44%;
            background: #ffffff;
            padding: 8px 8px 24px 8px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            position: relative;
            transform: rotate(-3deg);
        }

        .photo-card.sketch {
            transform: rotate(3deg);
            padding: 8px 8px 12px 8px;
        }

        .photo-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        /* Washi tape decoration on original photo */
        .tape {
            position: absolute;
            top: -10px;
            left: 30%;
            width: 50px;
            height: 16px;
            background: rgba(186, 153, 232, 0.5);
            transform: rotate(-5deg);
        }

        /* Curved Arrow Between Photos */
        .arrow-curve {
            position: absolute;
            top: 30%;
            left: 47%;
            width: 36px;
            height: 24px;
            z-index: 2;
        }

        .arrow-curve svg {
            width: 100%;
            height: 100%;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Pencil overlapping bottom right of sketch */
        .pencil-img {
            position: absolute;
            bottom: -15px;
            right: -10px;
            width: 60px;
            transform: rotate(-35deg);
            z-index: 3;
            filter: drop-shadow(-2px 4px 6px rgba(0,0,0,0.2));
        }

        /* Action Buttons */
        .action-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, #6c5ce7 0%, #442cf5 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            padding: 18px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(68, 44, 245, 0.25);
            text-decoration: none;
            transition: transform 0.1s ease;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .primary-btn span {
            flex: 1;
            text-align: center;
        }

        .primary-btn svg {
            width: 20px;
            height: 20px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .secondary-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            color: #442cf5;
        }

        .secondary-link svg {
            width: 16px;
            height: 16px;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Bottom decorative heart/wave watermark */
        .bottom-decoration {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottom-decoration svg {
            width: 120px;
            height: 30px;
            stroke: #442cf5;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <main class="app-container">
        
        <!-- Top Navigation Bar -->
        <header class="top-bar">
            <button class="icon-btn" aria-label="Crown features">
                <svg viewBox="0 0 24 24">
                    <path d="M3 17L5 8L10 12L12 5L14 12L19 8L21 17H3Z"></path>
                    <line x1="3" y1="20" x2="21" y2="20"></line>
                </svg>
            </button>
            <button class="icon-btn" aria-label="Settings">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </header>

        <!-- Brand Section -->
        <section class="brand-section">
            <div class="logo-row">
                <h1 class="logo-title">Draw<span>Step</span></h1>
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    <path d="M2 2l7.586 7.586"></path>
                    <circle cx="11" cy="11" r="2"></circle>
                </svg>
            </div>
            <p class="brand-subtitle">Draw it step by step.</p>
        </section>

        <!-- Main Heading -->
        <h2 class="main-heading">
            Turn any photo into a<br>step-by-step <span>drawing lesson.</span>
        </h2>

        <!-- Step Features Row -->
        <div class="steps-grid">
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span class="step-text">Choose a photo</span>
            </div>
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    <path d="M2 2l7.586 7.586"></path>
                </svg>
                <span class="step-text">Pick your style</span>
            </div>
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                </svg>
                <span class="step-text">Get your lesson</span>
            </div>
            <div class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span class="step-text">Draw step by step</span>
            </div>
        </div>

        <!-- Visual Photo Showcase -->
        <div class="showcase-container">
            <!-- Original Photo Card -->
            <div class="photo-card">
                <div class="tape"></div>
                <img src="assets/origin-land.png" alt="Original landscape photo">
            </div>

            <!-- Curved Arrow -->
            <div class="arrow-curve">
                <svg viewBox="0 0 24 24">
                    <path d="M3 12C3 7 8 4 15 6C18.5 7.1 21 10 21 10M21 10L16 6M21 10L17 14"></path>
                </svg>
            </div>

            <!-- Sketch Photo Card with Pencil -->
            <div class="photo-card sketch">
                <img src="assets/pencil-land.png" alt="Pencil drawn landscape sketch">
                <!-- Inline SVG Pencil Graphic matching the exact photo look -->
                <svg class="pencil-img" viewBox="0 0 100 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M35 10L65 10L70 190L30 190L35 10Z" fill="#e5c158" stroke="#b39029" stroke-width="3"/>
                    <path d="M30 190L50 230L70 190L30 190Z" fill="#222222"/>
                    <path d="M45 210L50 230L55 210L45 210Z" fill="#d0d0d0"/>
                    <rect x="30" y="10" width="40" height="25" fill="#f07070" stroke="#c04040" stroke-width="2"/>
                    <rect x="30" y="35" width="40" height="8" fill="#d0d0d0"/>
                    <path d="M42 10L42 190M58 10L58 190" stroke="rgba(0,0,0,0.15)" stroke-width="3"/>
                </svg>
            </div>
        </div>

        <!-- Call to Action Container -->
        <div class="action-container">
            <a href="#" class="primary-btn">
                <span>Get Started</span>
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>

            <a href="#" class="secondary-link">
                <span>View plans</span>
                <svg viewBox="0 0 24 24">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </a>
        </div>

        <!-- Bottom Wave / Heart Ornament -->
        <div class="bottom-decoration">
            <svg viewBox="0 0 120 30">
                <path d="M5 25C20 5 35 25 50 15C65 5 70 25 90 10C98 4 110 15 115 15C118 15 119 10 115 8" />
                <path d="M55 12C52 8 47 8 44 11C41 14 41 18 45 22L55 28L65 22C69 18 69 14 66 11C63 8 58 8 55 12Z" fill="none" stroke-width="2"/>
            </svg>
        </div>

    </main>

</body>
</html>
