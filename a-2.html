<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DrawStep</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5842E3;
            --primary-gradient: linear-gradient(135deg, #7C69EF 0%, #5842E3 100%);
            --text-main: #1E2029;
            --text-body: #2D3142;
            --text-muted: #5A607F;
            --border-color: #E2E8F0;
            --bg-color: #f8f9fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(220, 225, 255, 0.4) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(230, 220, 255, 0.4) 0px, transparent 50%);
            color: var(--text-body);
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            padding: 24px 20px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar .icon-free {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .top-bar svg,
        .step-icon,
        .primary-btn svg,
        .secondary-link svg {
            stroke: var(--primary);
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .top-bar svg {
            width: 26px;
            height: 26px;
            stroke-width: 2;
            cursor: pointer;
        }

        /* Brand / Logo */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-row {
            display: block;
            width: max-content;
            height: 64px;
            position: relative;
            margin-bottom: 4px;
        }

        .logo-title {
            font-size: 2.15rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -1.15px;
            line-height: 1;
            white-space: nowrap;
            position: relative;
            z-index: 2;
        }

        .logo-title span {
            color: var(--primary);
            font-weight: 600;
        }

        .logo-icon {
            position: absolute;
            left: calc(100% - 13px);
            top: -8px;
            width: 58px;
            height: 58px;
            overflow: visible;
            stroke: var(--primary);
            fill: none;
            stroke-width: 2.1;
            stroke-linecap: round;
            stroke-linejoin: round;
            z-index: 3;
        }

        .logo-icon .logo-line {
            stroke: var(--primary);
            stroke-width: 2.4;
        }

        .brand-subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Main Heading */
        .main-heading {
            text-align: center;
            font-size: 1.65rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
            margin-bottom: 28px;
        }

        .main-heading span {
            color: var(--primary);
        }

        /* 4-Step Process Grid */
        .steps-grid {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
            list-style: none;
        }

        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            flex: 1;
            position: relative;
        }

        .step-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 10px;
            width: 1px;
            height: 36px;
            background-color: var(--border-color);
        }

        .step-icon {
            width: 26px;
            height: 26px;
            stroke-width: 2;
        }

        .step-text {
            font-size: 0.78rem;
            font-weight: 600;
            color: #4A5568;
            max-width: 80px;
            line-height: 1.25;
        }

        /* Visual Showcase */
        .showcase-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            margin-bottom: 36px;
            padding: 10px 0;
        }

        .photo-card {
            width: 44%;
            background: #ffffff;
            padding: 8px 8px 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            position: relative;
        }

        .photo-card.photo-left {
            transform-origin: bottom right;
            transform: rotate(-12deg) translateX(-6px);
            margin-right: -4px;
            z-index: 1;
        }

        .photo-card.sketch-right {
            transform-origin: bottom left;
            transform: rotate(12deg) translateX(6px);
            margin-left: -4px;
            z-index: 2;
        }

        .photo-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            border-radius: 2px;
        }

        /* Custom Hand-Drawn Arrow Styling */
        .arrow-curve {
            position: absolute;
            top: 20%;
            left: 50%;
            width: 86px;
            height: 54px;
            z-index: 5;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .arrow-curve svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Buttons Container */
        .action-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .primary-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 18px 24px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(88, 66, 227, 0.3);
            text-decoration: none;
        }

        .primary-btn span {
            flex: 1;
            text-align: center;
        }

        .primary-btn svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            stroke-width: 2.5;
            position: absolute;
            right: 20px;
        }

        .secondary-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
        }

        .secondary-link svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.5;
        }

        /* Landscape Mode Layout */
        @media screen and (orientation: landscape) {
            .app-container {
                max-width: 100%;
                padding: 32px 48px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto 1fr;
                gap: 20px 40px;
                align-items: center;
            }

            .top-bar {
                grid-column: 1 / -1;
                margin-bottom: 0;
            }

            .brand-section {
                grid-column: 1;
                align-items: flex-start;
                text-align: left;
                margin-bottom: 12px;
            }

            .main-heading {
                grid-column: 1;
                text-align: left;
                margin-bottom: 24px;
                font-size: 2.2rem;
            }

            .steps-grid {
                grid-column: 1;
                margin-bottom: 32px;
            }

            .action-container {
                grid-column: 1;
                max-width: 280px;
                align-items: flex-start;
            }

            .primary-btn {
                padding: 14px 20px;
            }

            .secondary-link {
                align-self: center;
            }

            .showcase-container {
                grid-column: 2;
                grid-row: 2 / span 4;
                margin-bottom: 0;
                align-self: center;
            }

            .photo-card img {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <main class="app-container">

        <!-- Header Controls -->
        <header class="top-bar">
            <img src="assets/free.png" alt="Free Icon" class="icon-free">
            <svg viewBox="0 0 24 24" aria-label="Settings">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </header>

        <!-- Brand Section -->
        <section class="brand-section">
            <div class="logo-row">
                <h1 class="logo-title">Draw<span>Step</span></h1>
                <svg class="logo-icon" viewBox="0 0 58 58" aria-hidden="true">
                    <path class="logo-line" d="M 33.1 33.8 C 32 38, 28 42, 24 42 C 20 42, 17 39, 13 41 C 10 42, 7 45, 4 45"/>
                    <g transform="rotate(23 39 20)">
                        <path d="M 34 7 C 34 4.5, 44 4.5, 44 7 Z"/>
                        <line x1="34" y1="7" x2="44" y2="7"/>
                        <rect x="34" y="7" width="10" height="21"/>
                        <line x1="37" y1="7" x2="37" y2="28"/>
                        <line x1="41" y1="7" x2="41" y2="28"/>
                        <path d="M 34 28 L 39 35 L 44 28 Z"/>
                        <path d="M 37.5 33 L 39 35 L 40.5 33 Z" fill="var(--primary)" stroke="var(--primary)"/>
                    </g>
                </svg>
            </div>
            <p class="brand-subtitle">Draw it step by step.</p>
        </section>

        <!-- Main Heading -->
        <h2 class="main-heading">
            Turn any photo into a<br>
            step-by-step <span>drawing lesson.</span>
        </h2>

        <!-- Process Steps Row -->
        <ol class="steps-grid">
            <li class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path><path d="M14 14l3.5-3.5L21 14"></path></svg>
                <span class="step-text">Choose a photo</span>
            </li>
            <li class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24"><path d="M18 2a2.828 2.828 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5L18 2z"></path><line x1="14" y1="6" x2="18" y2="10"></line></svg>
                <span class="step-text">Pick your style</span>
            </li>
            <li class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24"><path d="M11 2C11 6.5 7.5 10 3 10C7.5 10 11 13.5 11 18C11 13.5 14.5 10 19 10C14.5 10 11 6.5 11 2Z"></path><path d="M18 15C18 17.5 16 19.5 13.5 19.5C16 19.5 18 21.5 18 24C18 21.5 20 19.5 22.5 19.5C20 19.5 18 17.5 18 15Z"></path></svg>
                <span class="step-text">Get your lesson</span>
            </li>
            <li class="step-item">
                <svg class="step-icon" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="10" rx="1"></rect><line x1="2" y1="15" x2="22" y2="15"></line><line x1="8" y1="15" x2="6" y2="22"></line><line x1="16" y1="15" x2="18" y2="22"></line><line x1="12" y1="2" x2="12" y2="5"></line></svg>
                <span class="step-text">Draw step by step</span>
            </li>
        </ol>

        <!-- Visual Showcase -->
        <div class="showcase-container">
            <div class="photo-card photo-left">
                <img src="assets/origin-land.png" alt="Landscape Photo">
            </div>
            <div class="arrow-curve">
                <svg viewBox="0 0 90 60" fill="none">
                    <path d="M 6 42 C 14 12, 54 4, 76 32" stroke="var(--primary)" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M 76 32 L 68 12" stroke="var(--primary)" stroke-width="3.5" stroke-linecap="round"/>
                    <path d="M 76 32 L 56 32" stroke="var(--primary)" stroke-width="3.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="photo-card sketch-right">
                <img src="assets/pencil-land.png" alt="Landscape Sketch">
            </div>
        </div>

        <!-- Action Callouts -->
        <div class="action-container">
            <a href="#" class="primary-btn">
                <span>Get Started</span>
                <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </a>
            <a href="#" class="secondary-link">
                <span>View plans</span>
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </a>
        </div>

    </main>

</body>
</html>
